<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網站內容管理後台｜臺中市林業生產合作社</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
<style>
:root{
  --green-900:#1d3a28;--green-700:#2d5a3d;--green-600:#3d7a52;--green-100:#e8f2ec;
  --ink:#26332b;--ink-soft:#5c6b62;--line:#e3eae5;--red:#c0392b;--gold:#a97f0f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#f4faf6;font-size:15px;line-height:1.6}
#login{max-width:380px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(29,58,40,.1);text-align:center}
#login h1{font-size:1.15rem;color:var(--green-900);margin-bottom:6px}
#login p{color:var(--ink-soft);font-size:.85rem;margin-bottom:20px}
#login input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;margin-bottom:14px}
#login input:focus{outline:none;border-color:var(--green-600)}
#login button{width:100%;padding:12px;background:var(--green-700);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
#login button:hover{background:var(--green-600)}
#login .err{color:var(--red);font-size:.85rem;margin-bottom:10px;min-height:1.2em}
#app{display:none}
.topbar{background:var(--green-900);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar b{font-size:1rem}
.topbar .spacer{flex:1}
.topbar a{color:#cfe5d8;font-size:.85rem;text-decoration:none}
.topbar a:hover{color:#f5d76e}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.85rem}
.topbar button:hover{background:rgba(255,255,255,.22)}
.layout{display:flex;min-height:calc(100vh - 52px)}
.tabs{width:190px;background:#fff;border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0}
.tabs button{display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;border-radius:10px;font-size:.92rem;cursor:pointer;color:var(--ink-soft);margin-bottom:4px}
.tabs button:hover{background:var(--green-100);color:var(--green-700)}
.tabs button.active{background:var(--green-700);color:#fff;font-weight:700}
.main{flex:1;padding:26px 30px 60px;max-width:900px}
.tab-title{font-size:1.25rem;font-weight:800;color:var(--green-900);margin-bottom:4px}
.tab-sub{color:var(--ink-soft);font-size:.85rem;margin-bottom:22px}
.group{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.group h3{font-size:.95rem;color:var(--green-700);margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.item{margin-bottom:14px}
.item label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.item input[type=text],.item input[type=url],.item textarea,.item input[type=password]{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.92rem;font-family:inherit}
.item input:focus,.item textarea:focus{outline:none;border-color:var(--green-600)}
.item textarea{min-height:96px;resize:vertical}
.item .row{display:flex;gap:10px}
.item .row > div{flex:1}
.img-field{display:flex;gap:14px;align-items:flex-start}
.img-field .thumb{width:110px;height:110px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--green-100);flex-shrink:0}
.img-field .ctrl{flex:1}
.img-field .btns{display:flex;gap:8px;margin-bottom:10px}
.img-field .btns button{background:var(--green-100);color:var(--green-700);border:1px solid var(--green-100);border-radius:8px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-weight:600}
.img-field .btns button:hover{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.img-field input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:.85rem;margin-top:4px}
.sub-item{border-top:1px dashed var(--line);padding-top:16px;margin-top:16px}
.sub-item > b{font-size:.85rem;color:var(--green-900);display:block;margin-bottom:10px}
.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;justify-content:center;backdrop-filter:blur(6px)}
.savebar .msg{font-size:.85rem;min-height:1.2em}
.savebar .msg.ok{color:var(--green-600)}
.savebar .msg.err{color:var(--red)}
.savebar button{background:var(--green-700);color:#fff;border:none;border-radius:10px;padding:10px 26px;font-size:.95rem;font-weight:700;cursor:pointer}
.savebar button:hover{background:var(--green-600)}
#modal{display:none;position:fixed;inset:0;background:rgba(20,40,28,.55);z-index:50;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:84vh;overflow:auto;padding:22px}
#modal .box h3{font-size:1rem;color:var(--green-900);margin-bottom:14px}
#modal .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#modal .grid button{position:relative;border:none;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--green-100)}
#modal .grid img{width:100%;height:100%;object-fit:cover;display:block}
#modal .grid button:hover img{transform:scale(1.06)}
#modal .grid img{transition:.2s}
#modal .close{float:right;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink-soft)}
.hint{font-size:.78rem;color:var(--ink-soft);margin-top:4px}
@media (max-width:720px){
  .layout{flex-direction:column}
  .tabs{width:100%;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:10px}
  .tabs button{width:auto;padding:8px 12px}
  .main{padding:20px 16px 90px}
  #modal .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="login">
  <h1>網站內容管理後台</h1>
  <p>臺中市林業生產合作社・森活樂校</p>
  <div class="err" id="loginErr"></div>
  <input type="password" id="pw" placeholder="請輸入管理密碼" autocomplete="current-password">
  <button id="loginBtn">登入</button>
</div>

<div id="app">
  <div class="topbar">
    <b>內容管理後台</b>
    <span class="spacer"></span>
    <a href="index.html" target="_blank">檢視網站 ↗</a>
    <button id="logoutBtn">登出</button>
  </div>
  <div class="layout">
    <div class="tabs" id="tabs"></div>
    <div class="main" id="main"></div>
  </div>
  <div class="savebar">
    <span class="msg" id="saveMsg"></span>
    <button id="saveBtn">儲存本頁修改</button>
  </div>
</div>

<div id="modal">
  <div class="box">
    <button class="close" id="modalClose">✕</button>
    <h3 id="modalTitle">選擇圖片</h3>
    <div class="grid" id="modalGrid"></div>
  </div>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
